packages:
  - apps/*
  - packages/*
overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.6.0
  vitest@*: 5.1.0
peerDependencyRules:
  allowedVersions:
    "vitest@5.1.0>vite": "1.6.0"
    "@vitest/mocker@5.1.0>vite": "1.6.0"
    "@tailwindcss/vite@4.3.4>vite": "1.6.0"
    "@vitejs/plugin-react@6.2.1>vite": "1.6.0"
