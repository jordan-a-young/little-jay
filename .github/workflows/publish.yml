name: Publish npm packages
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact 40-character SHA of the reviewed release commit on main
        required: true
        type: string
permissions: {}
concurrency:
  group: littlejay-npm-publication
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.repository == 'jordan-a-young/little-jay' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'jordan-a-young' &&
      github.triggering_actor == 'jordan-a-young'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.artifacts.outputs.artifact-id }}
    steps:
      - name: Require deliberate activation and exact main commit
        env:
          ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          EVENT_COMMIT: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
        run: |
          test "$ENABLED" = true || { echo 'Publication is disabled; complete the release runbook first.'; exit 1; }
          test "$EVENT_REF" = refs/heads/main
          test "$RELEASE_COMMIT" = "$EVENT_COMMIT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Reject main moving since dispatch
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm secrets:install
      - run: pnpm release:check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: artifacts
        with:
          name: verified-npm-release
          path: .release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: verify
    if: >-
      github.repository == 'jordan-a-young/little-jay' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'jordan-a-young' &&
      github.triggering_actor == 'jordan-a-young'
    environment: npm-publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          merge-multiple: true
          path: .release/
      - name: Publish verified tarballs and record release tags
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51
        with:
          script: pnpm release:publish --verified-artifacts --confirm ${{ github.sha }}
          create-github-releases: true
          push-git-tags: true
        env:
          LITTLEJAY_PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
      - name: Retain publication report even after partial failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-publication-report
          path: .release/publish-summary.json
          if-no-files-found: ignore
          retention-days: 30
