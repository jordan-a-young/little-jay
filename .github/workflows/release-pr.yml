name: Release PR
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: littlejay-release-pr
  cancel-in-progress: false
jobs:
  version:
    if: github.repository == 'jordan-a-young/little-jay' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr-number: ${{ steps.version.outputs.pr-number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Detect pending release notes
        id: notes
        run: |
          node --input-type=module -e '
            import { readdirSync, appendFileSync } from "node:fs";
            const pending = readdirSync(".changeset").some(name => name.endsWith(".md") && !["README.md", "AGENTS.md"].includes(name));
            appendFileSync(process.env.GITHUB_OUTPUT, `pending=${pending}\n`);
          '
      - name: Open or update release PR
        id: version
        if: steps.notes.outputs.pending == 'true'
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51
        with:
          script: pnpm release:version
          commit-message: "chore: version packages"
          pr-title: "chore: release Little Jay packages"
          pr-draft: create
  verify-release-pr:
    needs: version
    if: needs.version.outputs.pr-number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/pull/${{ needs.version.outputs.pr-number }}/head
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm secrets:install
      - run: pnpm release:check
